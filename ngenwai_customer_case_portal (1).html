<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เงินไว โกลด์ | ศูนย์บริการลูกค้า</title><style>
body{margin:0;background:#f6f1e6;color:#211c12;font-family:system-ui,"Noto Sans Thai",sans-serif}header{background:#17130a;color:#fff;padding:16px 20px;display:flex;justify-content:space-between}.brand{font-weight:900}.brand b{color:#f4d46d}main{max-width:900px;margin:auto;padding:22px 15px}.hero{background:linear-gradient(135deg,#17130a,#3d2d0e 65%,#d5a52b);color:#fff;border-radius:20px;padding:30px}.card{background:#fff;border:1px solid #e5d9c0;border-radius:16px;padding:19px;margin:14px 0;box-shadow:0 6px 20px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:13px}.field{margin:11px 0}.field label{display:block;font-weight:800;margin-bottom:5px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d5c8ad;border-radius:9px;font:inherit}button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:#d5a52b;color:#17130a}.notice{background:#fff7dd;border:1px solid #e5cf88;border-radius:10px;padding:11px;font-size:13px}.result{border:2px solid #d5a52b;background:#fffdf5;border-radius:14px;padding:18px}.ref{font-size:23px;font-weight:900;color:#8b6814}.status{display:inline-block;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:800}.new{background:#fff1bd;color:#765600}.work{background:#dcecff;color:#275c8f}.wait{background:#eee5ff;color:#6441a0}.done{background:#d9f4e5;color:#17663e}.fail{background:#f8d9d7;color:#8b2b26}.timeline{border-left:3px solid #d5a52b;padding-left:16px}.event{margin:15px 0}.modal{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#fff;border-radius:18px;padding:20px;max-width:800px;width:100%}.close{float:right;background:#eee}@media(max-width:600px){header{flex-direction:column;gap:6px}}
</style></head><body><header><div class="brand">บริษัท เงินไว จำกัด · <b>เงินไว โกลด์</b></div><span>ศูนย์บริการลูกค้า</span></header><main>
<section class="hero"><h1>แจ้งรายการ / ปัญหา</h1><p>ส่งรายละเอียดให้เจ้าหน้าที่ตรวจสอบ และติดตามความคืบหน้าด้วยเลขเคส</p><button class="primary" onclick="document.getElementById('form').scrollIntoView()">แจ้งรายการใหม่</button></section>
<section id="form" class="card"><h2>ส่งรายการให้เจ้าหน้าที่</h2><div class="notice">ต้นแบบนี้เก็บข้อมูลในเบราว์เซอร์เครื่องนี้เท่านั้น ไม่ควรใส่ข้อมูลจริงจนกว่าจะติดตั้งระบบฐานข้อมูลและความปลอดภัย</div><div class="grid"><div class="field"><label>ชื่อ-นามสกุล</label><input id="name"></div><div class="field"><label>เบอร์โทรศัพท์</label><input id="phone"></div></div><div class="field"><label>ประเภท</label><select id="type"><option>ตรวจสอบรายการ</option><option>แจ้งปัญหาการทำรายการ</option><option>ส่งเอกสารเพิ่มเติม</option><option>สอบถามข้อมูล</option><option>อื่น ๆ</option></select></div><div class="field"><label>รายละเอียด</label><textarea id="detail" rows="5"></textarea></div><div class="field"><label>แนบภาพ/เอกสาร</label><input id="file" type="file" accept="image/*"></div><button class="primary" onclick="submitCase()">ส่งรายการ</button></section>
<section class="card"><h2>ตรวจสอบสถานะ</h2><div class="grid"><div class="field"><label>เลขเคส</label><input id="ref" placeholder="CASE-2026-000125"></div><div class="field"><label>เบอร์โทรศัพท์</label><input id="verifyPhone"></div></div><button class="primary" onclick="lookup()">ตรวจสอบ</button><div id="out" style="margin-top:14px"></div></section>
</main><div id="modal" class="modal"><div class="box"><button class="close" onclick="closeM()">×</button><div id="mc"></div></div></div>
<script>
const KEY="ngold_cases_v1";let cases=JSON.parse(localStorage.getItem(KEY)||"null")||[];const save=()=>localStorage.setItem(KEY,JSON.stringify(cases));const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const lab=s=>({new:"รับเรื่องใหม่",work:"กำลังดำเนินการ",wait:"รอข้อมูลเพิ่มเติม",done:"ดำเนินการเสร็จสิ้น",fail:"ไม่สามารถดำเนินการ"}[s]||s);
function submitCase(){if(!name.value.trim()||!phone.value.trim()||!detail.value.trim())return alert("กรุณากรอกชื่อ เบอร์โทรศัพท์ และรายละเอียด");let f=file.files[0],make=img=>{let d=new Date(),id="CASE-"+d.getFullYear()+"-"+String(Date.now()).slice(-6);cases.unshift({id,name:name.value.trim(),phone:phone.value.trim(),type:type.value,date:d.toLocaleDateString("th-TH"),time:d.toLocaleTimeString("th-TH",{hour:"2-digit",minute:"2-digit"}),status:"new",owner:"ยังไม่ได้มอบหมาย",note:detail.value.trim(),img:img||"",events:[[d.toLocaleString("th-TH"),"ลูกค้าส่งเรื่องเข้าระบบ"]]});save();ref.value=id;verifyPhone.value=phone.value.trim();mc.innerHTML='<div class="result"><h2>ส่งรายการสำเร็จ</h2><p>เลขเคสของคุณคือ</p><div class="ref">'+id+'</div><p>เก็บเลขเคสและเบอร์โทรศัพท์ไว้สำหรับตรวจสอบสถานะ</p></div>';modal.classList.add("show");name.value="";phone.value="";detail.value="";file.value=""};if(f){let r=new FileReader();r.onload=()=>make(r.result);r.readAsDataURL(f)}else make("")}
function lookup(){let id=ref.value.trim(),ph=verifyPhone.value.trim(),x=cases.find(a=>a.id===id&&a.phone===ph);if(!x){out.innerHTML='<div class="notice">ไม่พบข้อมูล กรุณาตรวจสอบเลขเคสและเบอร์โทรศัพท์</div>';return}out.innerHTML='<div class="result"><h2>สถานะรายการ</h2><div class="ref">'+x.id+'</div><p><b>ประเภท:</b> '+esc(x.type)+'</p><p><b>สถานะ:</b> <span class="status '+x.status+'">'+lab(x.status)+'</span></p><p><b>เจ้าหน้าที่:</b> '+esc(x.owner)+'</p><p><b>รายละเอียด:</b><br>'+esc(x.note)+'</p><h3>ประวัติการดำเนินการ</h3><div class="timeline">'+x.events.map(e=>'<div class="event"><b>'+esc(e[0])+'</b><br>'+esc(e[1])+'</div>').join("")+'</div>'+(x.status==="done"||x.status==="fail"?'<button class="primary" onclick="result('+JSON.stringify(x.id)+')">ดูใบสรุปผล</button>':"")+'</div>'}
function result(id){let x=cases.find(a=>a.id===id);mc.innerHTML='<div style="max-width:650px;margin:auto;padding:28px;border:1px solid #ddd;border-radius:14px"><h2 style="color:#946f15">เงินไว โกลด์</h2><h3>ใบสรุปผลการดำเนินการ</h3><p><b>เลขเคส:</b> '+x.id+'</p><p><b>ลูกค้า:</b> '+esc(x.name)+'</p><p><b>วันที่:</b> '+x.date+' '+x.time+'</p><p><b>สถานะ:</b> '+lab(x.status)+'</p><p><b>รายละเอียด:</b> '+esc(x.note)+'</p><div class="notice">เอกสารนี้เป็นสรุปผลจากระบบต้นแบบ</div></div><br><button class="primary" onclick="window.print()">พิมพ์ / บันทึกเป็น PDF</button>';modal.classList.add("show")}function closeM(){modal.classList.remove("show")}
</script></body></html>
